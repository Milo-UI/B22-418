<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!--
        Creare una todo list nella quale si possa:
            - aggiungere nuove task
            - cancellare task già presenti
            - cercare task specifiche filtrando quelle esistenti

        I campi di ricerca e di aggiunta task devono essere dei campi di input.
        La lista di task deve essere un UL con un LI per ogni task.
        In ognuna deve esserci l'icona di una 'x' o di un cestino per eliminare la task.
        Non c'è bisogno di bottoni di submit, perché la ricerca delle task deve essere istantanea e l'aggiunta di una task deve avvenire tramite tasto di invio.
        Stile completamente libero, ma almeno deve esserci un container centrato.
        Punti in più se vengono utilizzati tag semantici in maniera corretta.
    -->

    <main>

        <div class="container">

            <header>
                <h1>ToDo List</h1>

                <form class="search-form">
                    <input type="text" name="search" placeholder="Cerca task...">
                </form>
            </header>

            <ul class="todos">
                <li>
                    <span>Fare la spesa</span>
                    <i class="fa-solid fa-trash delete"></i>
                </li>
                <li>
                    <span>Pulire il bagno</span>
                    <i class="fa-solid fa-trash delete"></i>
                </li>
                <li>
                    <span>Dormire dopo lezione</span>
                    <i class="fa-solid fa-trash delete"></i>
                </li>
            </ul>

            <form class="add-form">
                <label for="add">Aggiungi una nuova task:</label>
                <input type="text" id="add" name="add">
            </form>

        </div>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
