<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrello E-commerce con API - Refactoring OOP</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!--
        ESERCIZO REFACTORING OOP

        Prendi il codice JavaScript dell'esercizio precedente (../carrello-api/js/script.js) e riscrivilo interamente in programmazione orientata agli oggetti.

        La logica deve rimanere identica: stessi filtri, stesso carrello, stesso salvataggio in local e session storage. Cambia solo come è organizzato il codice.

        STRUTTURA DA SEGUIRE
        Devi creare 3 classi, ciascuna con una responsabilità precisa. Il punto centrale dell'esercizio è capire come farle comunicare tra loro.

            - Classe 1 — Cart
                Responsabilità: gestione CRUD (Create, Read, Update, Delete) del carrello e persistenza in localStorage.
                - Non sa nulla del DOM
                - Non conosce i dati dei prodotti: li riceve come parametro nei metodi che ne hanno bisogno
                - Seve esporre metodi per aggiungere, rimuovere, modificare le quantità e svuotare il carrello
                - Deve esporre metodi per calcolare il totale e il numero di articoli
                - Deve salvare in localStorage ogni volta che il carrello cambia
            
            - Classe 2 — ProductCatalog
                Responsabilità: recupero dei prodotti dall'API, filtri e ordinamento, persistenza dei filtri in sessionStorage.
                - Non sa nulla del DOM
                - Deve esporre un metodo async per caricare i prodotti dall'API e gestire eventuali errori
                - Deve esporre un metodo che restituisce i prodotti filtrati e ordinati secondo lo stato attivo (senza modificare l'array originale)
                - Deve esporre un metodo che restituisce le categorie uniche presenti nei prodotti
                - Quando la categoria o l'ordinamento cambiano, deve aggiornarsi e salvare di nuovo il valore in sessionStorage

            - Classe 3 — App
                Responsabilità: rendering del DOM e gestione degli eventi. Coordina Cart e ProductCatalog.
                - Nel costruttore crea le istanze di Cart e ProductCatalog e acquisisce i riferimenti agli elementi del DOM
                - Deve esporre un metodo async init() che carica i prodotti e avvia i render iniziali
                - Deve esporre metodi separati per renderizzare i prodotti, il carrello e le opzioni di filtrow
                - Tutti gli event listener vanno registrati in un unico metodo dedicato, chiamato una sola volta

        COME SI AVVIA L'APP
        Niente IIFE, niente funzioni globali "sciolte", l'app deve avviarsi tramite il metodo init() di un oggetto App.
    -->

    <div class="container">

        <header>
            <h1>Shop API</h1>

            <div class="filtri">
                <select name="categoria" class="filtro-categoria">
                    <option value="tutte">Tutte le categorie</option>
                </select>

                <select name="ordine" class="filtro-ordine">
                    <option value="default">Ordine di default</option>
                    <option value="prezzo-asc">Prezzo: crescente</option>
                    <option value="prezzo-desc">Prezzo: decrescente</option>
                </select>
            </div>
        </header>

        <div class="loading">Caricamento prodotti…</div>

        <div class="prodotti-grid"></div>

        <section class="carrello-section">
            <div class="carrello-header">
                <h2>Carrello (<span class="conteggio">0</span>)</h2>
                <button class="btn btn-ghost svuota">Svuota carrello</button>
            </div>

            <ul class="carrello"></ul>

            <div class="totale">
                <span>Totale</span>
                <span class="totale-valore">0.00 $</span>
            </div>
        </section>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
