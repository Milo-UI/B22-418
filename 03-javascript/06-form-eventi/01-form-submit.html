<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript - Form eventi - 01 Form e eventi nei form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body data-bs-theme="dark">

    <div class="container py-5">
        <div class="row">

            <div class="col-12">
                <h1>JavaScript - Form eventi - 01 Form e eventi nei form</h1>

                <form class="signup-form">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control mb-3" type="text" id="username" placeholder="Scegli il tuo username">

                    <!-- Questo input crea un bottone che lancia un evento di submit all'interno del form -->
                    <input class="btn btn-primary" type="submit" value="Registrati">
                </form>
            </div>

        </div>
    </div>

    <script src="js/01-form-submit.js"></script>
</body>
</html>
